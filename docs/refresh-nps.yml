name: Refresh park data

on:
  schedule:
    - cron: "7 * * * *"      # hourly: park alerts
    - cron: "37 10 * * *"    # daily, ~4:37 a.m. in Medora: full refresh (things to do, places, visitor center hours)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-nps
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull NPS data
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "7 * * * *" ]; then
            node scripts/build-nps.mjs --alerts
          else
            node scripts/build-nps.mjs
          fi
      - name: Commit if changed
        run: |
          git config user.name "trnp-planner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nps.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh park data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
